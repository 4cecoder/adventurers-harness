[project]
name = "adventurers-harness"
version = "1.0.0"
description = "Native macOS Coding Agent Harness with Deterministic Verification Gates"
requires-python = ">=3.11"
dependencies = [
    "cactus-needle>=2.0.8",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]
