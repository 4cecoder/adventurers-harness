<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="50%" stop-color="#0B0B0E"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FF9F0A" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#0A84FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass & Metal Accents -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#26262E" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#18181D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F0F12" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <linearGradient id="gateRingCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>

    <linearGradient id="gateRingEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="appShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Squircle with Native Shadow -->
  <g filter="url(#appShadow)">
    <rect x="92" y="92" width="840" height="840" rx="190" ry="190" fill="url(#bgGrad)"/>
    <rect x="92" y="92" width="840" height="840" rx="190" ry="190" fill="url(#coreGlow)"/>
    <rect x="92" y="92" width="840" height="840" rx="190" ry="190" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>
  </g>

  <!-- Cybernetic Grid & Certification Rings -->
  <g opacity="0.35">
    <circle cx="512" cy="512" r="320" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 12"/>
    <circle cx="512" cy="512" r="260" fill="none" stroke="#FF6B35" stroke-width="2" stroke-dasharray="18 8"/>
    <circle cx="512" cy="512" r="200" fill="none" stroke="#64D2FF" stroke-width="1.5" stroke-dasharray="4 8"/>
  </g>

  <!-- Hexagonal Precision Ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2">
    <line x1="512" y1="130" x2="512" y2="160"/>
    <line x1="512" y1="864" x2="512" y2="894"/>
    <line x1="130" y1="512" x2="160" y2="512"/>
    <line x1="864" y1="512" x2="894" y2="512"/>
  </g>

  <!-- Central Adventurer Shield -->
  <g filter="url(#appShadow)">
    <path d="M 512 240 
             C 630 240 720 280 720 380 
             C 720 590 580 710 512 760 
             C 444 710 304 590 304 380 
             C 304 280 394 240 512 240 Z"
          fill="url(#shieldGrad)"
          stroke="url(#borderGrad)"
          stroke-width="3"/>
  </g>

  <!-- Inner Shield Glow Inlay -->
  <path d="M 512 270 
           C 610 270 686 304 686 390 
           C 686 565 568 668 512 710 
           C 456 668 338 565 338 390 
           C 338 304 414 270 512 270 Z"
        fill="none"
        stroke="url(#gateRingCyan)"
        stroke-width="2"
        opacity="0.5"/>

  <!-- Glowing Agent Compass Needle / Quantum Blade -->
  <g filter="url(#intenseGlow)">
    <!-- Upper Blade (North Star / Vanguard) -->
    <polygon points="512,290 546,490 512,530 478,490" fill="url(#bladeGrad)"/>
    <!-- Specular Highlight Line -->
    <line x1="512" y1="290" x2="512" y2="530" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Lower Blade (South Anchor) -->
    <polygon points="512,710 540,534 512,500 484,534" fill="#30D158" opacity="0.9"/>
    <line x1="512" y1="500" x2="512" y2="710" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Horizontal Wing Accents -->
    <polygon points="380,512 490,488 512,512 490,536" fill="#0A84FF" opacity="0.8"/>
    <polygon points="644,512 534,488 512,512 534,536" fill="#FF9F0A" opacity="0.8"/>
  </g>

  <!-- Center Quantum Node -->
  <circle cx="512" cy="512" r="28" fill="#09090B" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="512" cy="512" r="16" fill="#FF6B35" filter="url(#neonGlow)"/>
  <circle cx="512" cy="512" r="7" fill="#FFFFFF"/>

  <!-- Telemetry Pulse Orbit Ticks -->
  <g stroke="#30D158" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#neonGlow)">
    <circle cx="512" cy="512" r="100" fill="none" stroke="#30D158" stroke-dasharray="14 48" stroke-width="2.5"/>
  </g>
</svg>
