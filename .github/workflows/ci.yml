name: CI (macOS ARM64)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-arm64:
    name: Swift Test on Apple Silicon
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Apple Silicon
        run: |
          echo "Architecture: $(uname -m)"
          [ "$(uname -m)" = "arm64" ] || exit 1

      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Swift Tests
        run: swift test

      - name: Build Executable
        run: swift build -c release --triple arm64-apple-macosx15.0
