name: Build & Package macOS ARM64

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-15 # Native Apple Silicon M-series runner (macOS 15 Sequoia)
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Apple Silicon Runner
        run: |
          echo "Architecture: $(uname -m)"
          echo "macOS Version: $(sw_vers -productVersion)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::Runner must be macOS arm64 (Apple Silicon). Got $(uname -m)"
            exit 1
          fi

      - name: Select Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Cache SwiftPM Dependencies & Build Cache
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Show Swift Toolchain Version
        run: swift --version

      - name: Run Core Test Suite
        run: |
          echo "🧪 Running unit tests on macOS arm64..."
          swift test --filter AdventurersCoreTests

      - name: Generate AppIcon (.icns) from SVG
        run: |
          echo "🎨 Generating high-resolution AppIcon.icns..."
          chmod +x scripts/generate_icon.sh
          ./scripts/generate_icon.sh

      - name: Determine Release Channel
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            if [[ "$TAG" == *-beta* ]]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          elif [[ "$REF" == "refs/heads/master" || "$REF" == "refs/heads/main" ]]; then
            CHANNEL="alpha"
          else
            CHANNEL="none" # PRs and other refs never publish
          fi
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "📡 Release channel: $CHANNEL"

      - name: Package macOS App, DMG & ZIP
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          echo "📦 Packaging Release application for Apple Silicon..."
          chmod +x scripts/package_app.sh
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}" # strip leading v if present
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/package_app.sh "$VERSION"

      - name: Verify Package Contents & Checksums
        run: |
          echo "🔍 Listing dist artifacts:"
          ls -lh dist/
          echo "🔒 SHA256 Checksums:"
          cat dist/*.sha256

      - name: Generate Signed Sparkle Appcast
        if: ${{ env.CHANNEL != 'none' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # The `secrets` context isn't available in step `if:` conditions, so the "is a signing
          # key configured" check has to happen here instead of at the step level.
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "⚠️  SPARKLE_PRIVATE_KEY not set — skipping appcast generation (see docs/updating.md)."
            exit 0
          fi

          # generate_appcast refuses a directory containing more than one archive for the same
          # bundle version (it can't tell which one Sparkle should actually serve as "the"
          # update), so give it a dedicated directory with only the .zip — the format Sparkle
          # itself uses to install updates — never the .dmg/.tar.gz which are for manual/Homebrew
          # installs only.
          mkdir -p dist/appcast-source
          cp dist/Adventurers-macOS-arm64.zip dist/appcast-source/

          # All three channels share ONE appcast feed (SUFeedURL always points at the `latest`
          # release's appcast.xml) — Sparkle tells channels apart via a <sparkle:channel> tag per
          # item, not via separate feeds. Fetch the existing feed first so new entries accumulate
          # instead of each build wiping out the others' history.
          echo "📡 Fetching existing appcast.xml (if any) so version/delta history accumulates..."
          curl -sL -f -o dist/appcast-source/appcast.xml "https://github.com/4cecoder/adventurers-harness/releases/download/latest/appcast.xml" || rm -f dist/appcast-source/appcast.xml
          chmod +x scripts/sparkle_tools.sh
          echo "🔏 Generating & signing appcast.xml for channel '${CHANNEL}'..."
          if [ "${CHANNEL}" = "stable" ]; then
            echo "$SPARKLE_PRIVATE_KEY" | ./scripts/sparkle_tools.sh generate_appcast --ed-key-file - dist/appcast-source/
          else
            echo "$SPARKLE_PRIVATE_KEY" | ./scripts/sparkle_tools.sh generate_appcast --ed-key-file - --channel "${CHANNEL}" dist/appcast-source/
          fi
          cp dist/appcast-source/appcast.xml dist/appcast.xml
          ls -la dist/appcast.xml

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Adventurers-macOS-arm64
          path: |
            dist/Adventurers-macOS-arm64.dmg
            dist/Adventurers-macOS-arm64.zip
            dist/Adventurers-macOS-arm64.tar.gz
            dist/Adventurers-macOS-arm64.dmg.sha256
            dist/Adventurers-macOS-arm64.zip.sha256
            dist/Adventurers-macOS-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Appcast Artifact
        if: ${{ env.CHANNEL != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: Adventurers-appcast
          path: dist/appcast.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Adventurers Harness ${{ github.ref_name }} (macOS arm64)${{ env.CHANNEL == 'beta' && ' [Beta]' || '' }}
          draft: false
          prerelease: ${{ env.CHANNEL == 'beta' }}
          files: |
            dist/Adventurers-macOS-arm64.dmg
            dist/Adventurers-macOS-arm64.zip
            dist/Adventurers-macOS-arm64.tar.gz
            dist/Adventurers-macOS-arm64.dmg.sha256
            dist/Adventurers-macOS-arm64.zip.sha256
            dist/Adventurers-macOS-arm64.tar.gz.sha256
          generate_release_notes: true

      # Homebrew tracks stable only — beta/alpha builds never touch the formula/cask.
      - name: Sync Homebrew Formula & Cask
        if: env.CHANNEL == 'stable'
        run: |
          set -euo pipefail
          DMG_SHA="$(cut -d' ' -f1 dist/Adventurers-macOS-arm64.dmg.sha256)"
          TAR_SHA="$(cut -d' ' -f1 dist/Adventurers-macOS-arm64.tar.gz.sha256)"
          echo "🍺 Syncing Formula/Cask to version ${VERSION} (dmg=${DMG_SHA}, tar=${TAR_SHA})"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master

          sed -i '' "s/^  version \".*\"/  version \"${VERSION}\"/" Formula/adventurers.rb Casks/adventurers.rb
          sed -i '' "s/^    sha256 \".*\"/    sha256 \"${TAR_SHA}\"/" Formula/adventurers.rb
          sed -i '' "s/^  sha256 \".*\"/  sha256 \"${DMG_SHA}\"/" Casks/adventurers.rb

          if git diff --quiet -- Formula/adventurers.rb Casks/adventurers.rb; then
            echo "✔ Formula/Cask already up to date, nothing to commit."
          else
            git add Formula/adventurers.rb Casks/adventurers.rb
            git commit -m "chore(homebrew): sync formula/cask to v${VERSION} [skip ci]"
            git push origin master
          fi

      # The `latest` release's assets are the ONE canonical location for appcast.xml — the app's
      # SUFeedURL always points here regardless of which channel a build belongs to, since Sparkle
      # tells channels apart via a per-item <sparkle:channel> tag in a single shared feed, not via
      # separate feed URLs. This step keeps that shared appcast (and a copy of the latest binaries)
      # in sync on every publishable build: master pushes (alpha), beta tags, and stable tags alike.
      # Only `make_latest` is reserved for real stable releases, so GitHub's own "Latest" badge
      # doesn't point at an alpha/beta build.
      - name: Sync Shared Appcast & Latest-Build Assets
        if: env.CHANNEL != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Adventurers Harness Latest (macOS Apple Silicon)
          draft: false
          prerelease: true
          make_latest: ${{ env.CHANNEL == 'stable' }}
          files: |
            dist/Adventurers-macOS-arm64.dmg
            dist/Adventurers-macOS-arm64.zip
            dist/Adventurers-macOS-arm64.tar.gz
            dist/Adventurers-macOS-arm64.dmg.sha256
            dist/Adventurers-macOS-arm64.zip.sha256
            dist/Adventurers-macOS-arm64.tar.gz.sha256
            dist/appcast.xml
          body: |
            ### Automated Continuous Build (macOS ARM64)
            Built from commit `${{ github.sha }}` on the **${{ env.CHANNEL }}** channel.

            This release's assets are always the most recent build from whichever channel last ran
            CI — switch channels in Settings → General → Update Channel to control which builds
            `appcast.xml` here actually offers you. `Adventurers-macOS-arm64.dmg` below is always the
            latest **alpha** build; for a specific stable or beta version see its own versioned
            release instead.

            #### Homebrew Installation (stable only)
            ```bash
            brew tap 4cecoder/adventurers https://github.com/4cecoder/adventurers-harness
            brew install adventurers
            ```
